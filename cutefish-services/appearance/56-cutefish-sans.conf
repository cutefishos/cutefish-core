<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
    <!-- The desktop's sans-serif face where no user has picked one: the login
         screen and programs outside a session. Strong, so it also leads for
         Chinese, Japanese and Korean, whose own faces then fill in their
         characters. Each session's own choice replaces it from the user's
         configuration. -->
    <match target="pattern">
        <test qual="any" name="family">
            <string>sans-serif</string>
        </test>
        <edit name="family" mode="prepend" binding="strong">
            <string>Inter</string>
        </edit>
    </match>
</fontconfig>
