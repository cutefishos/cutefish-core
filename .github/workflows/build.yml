name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    uses: cutefishos/.github/.github/workflows/build.yml@main
    with:
      dependencies: icons cutefish-toolkit cutefish-framework
      test-projects: >-
        common/tests appruntime/tests session/tests cutefish-services/tests
        tests/battery tests/language tests/nightlight tests/permissions
        tests/power tests/privacy tests/screenrecorder
